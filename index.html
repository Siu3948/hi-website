<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aim Trainer Pro</title>
  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#111; color:#fff; text-align:center; }
    header { background:#222; padding:1rem; }
    #gameArea { position:relative; width:100%; height:80vh; background:#000; overflow:hidden; }
    .target { position:absolute; width:40px; height:40px; border-radius:50%; background:red; cursor:pointer; }
    #scoreboard { margin:1rem; }
    button { margin:0.5rem; padding:0.5rem 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Aim Trainer Pro</h1>
    <button onclick="startGame('classic')">Classic Mode</button>
    <button onclick="startGame('timed')">Timed Mode</button>
    <button onclick="startGame('rapid')">Rapid Mode</button>
  </header>
  <div id="scoreboard">Score: 0 | Rank: Beginner</div>
  <div id="gameArea"></div>
  <script>
    let score=0, mode='classic', timer=null, gameRunning=false;

    function startGame(selectedMode){
      mode=selectedMode; score=0; updateScore();
      clearInterval(timer); gameRunning=true;
      spawnTarget();
      if(mode==='timed'){
        setTimeout(()=>endGame(),10000); // 10s timed
      } else if(mode==='rapid'){
        timer=setInterval(spawnTarget,500); // rapid spawn
      }
    }

    function spawnTarget(){
      if(!gameRunning) return;
      const area=document.getElementById('gameArea');
      const target=document.createElement('div');
      target.className='target';
      target.style.top=Math.random()*(area.clientHeight-40)+'px';
      target.style.left=Math.random()*(area.clientWidth-40)+'px';
      target.onclick=()=>{ score++; updateScore(); area.removeChild(target); };
      area.appendChild(target);
      setTimeout(()=>{ if(area.contains(target)) area.removeChild(target); },2000);
    }

    function updateScore(){
      let rank='Beginner';
      if(score>10) rank='Intermediate';
      if(score>25) rank='Advanced';
      if(score>50) rank='Pro';
      document.getElementById('scoreboard').innerText=`Score: ${score} | Rank: ${rank}`;
    }

    function endGame(){
      gameRunning=false;
      alert(`Game Over! Final Score: ${score}`);
    }
  </script>
</body>
</html>
