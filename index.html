<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RANGE — Aim Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e10;
    --panel: #12181b;
    --panel-line: #1e2b2f;
    --cyan: #4dd9ff;
    --cyan-dim: #1c4a57;
    --coral: #ff5d5d;
    --amber: #ffb347;
    --text: #d7dee0;
    --muted: #5e7278;
    --good: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  .display { font-family: 'Oswald', sans-serif; }

  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- HUD ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-line);
    z-index: 10;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .eyebrow {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
  }
  .brand h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--cyan);
  }

  .hud-stats {
    display: flex;
    gap: 28px;
  }
  .stat { text-align: right; }
  .stat .label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    display: block;
  }
  .stat .value {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }
  .stat.accent .value { color: var(--cyan); }
  #time-value.low { color: var(--coral); }

  /* ---------- PLAY AREA ---------- */
  #arena {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #05070a;
    cursor: none;
  }

  #world {
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    background:
      radial-gradient(circle at 50% 50%, rgba(77,217,255,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px);
    will-change: transform;
  }

  #lock-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,7,10,0.6);
    z-index: 15;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 2px;
    color: var(--cyan);
    font-size: 15px;
    cursor: pointer;
    text-align: center;
  }
  #lock-hint.hidden { display: none; }
  #lock-hint span { display: block; font-size: 10px; color: var(--muted); margin-top: 8px; letter-spacing: 1px; }

  /* pause / settings button, always reachable mid-session, no reload needed */
  #pause-btn {
    position: fixed;
    top: 14px;
    right: 24px;
    z-index: 30;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 8px 14px;
    cursor: pointer;
  }
  #pause-btn:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  #pause-btn.hidden { display: none; }

  .target {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8080, var(--coral) 70%);
    box-shadow: 0 0 18px rgba(255,93,93,0.45), inset 0 0 10px rgba(0,0,0,0.35);
    cursor: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .target::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid rgba(255,93,93,0.5);
  }
  .target .decay-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
  }
  .target .core {
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: rgba(10,14,16,0.55);
  }

  .burst {
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--amber);
    pointer-events: none;
    animation: burst-out 0.35s ease-out forwards;
  }
  @keyframes burst-out {
    from { transform: scale(0.3); opacity: 1; }
    to { transform: scale(2.2); opacity: 0; }
  }

  .miss-x {
    position: absolute;
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
    animation: miss-fade 0.5s ease-out forwards;
  }
  @keyframes miss-fade {
    from { opacity: 0.9; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-14px); }
  }

  /* custom reticle cursor */
  #reticle {
    position: fixed;
    width: 26px;
    height: 26px;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 999;
    display: none;
  }
  #reticle svg { width: 100%; height: 100%; }

  /* ---------- OVERLAYS ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10,14,16,0.92);
