<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Valorant Tracker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f1923;
    color:white;
}

header{
    text-align:center;
    padding:40px;
    font-size:50px;
    font-weight:bold;
    color:#ff4655;
    letter-spacing:3px;
}

.search{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:40px;
}

input{
    width:350px;
    padding:15px;
    border:none;
    border-radius:8px;
    font-size:18px;
}

button{
    background:#ff4655;
    color:white;
    border:none;
    border-radius:8px;
    padding:15px 30px;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#ff6a77;
}

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1b2733;
    border-radius:12px;
    padding:20px;
    border:2px solid #ff4655;
    text-align:center;
    box-shadow:0 0 20px rgba(255,70,85,.3);
}

.card h2{
    color:#ff4655;
    margin-bottom:15px;
}

.value{
    font-size:28px;
    font-weight:bold;
}

footer{
    text-align:center;
    margin:40px;
    color:gray;
}
</style>

</head>
<body>

<header>
VALORANT TRACKER
</header>

<div class="search">
<input id="riot" placeholder="Enter Riot ID (Player#TAG)">
<button onclick="searchPlayer()">Search</button>
</div>

<div class="container">

<div class="grid">

<div class="card">
<h2>Rank</h2>
<div class="value" id="rank">-</div>
</div>

<div class="card">
<h2>K/D</h2>
<div class="value" id="kd">-</div>
</div>

<div class="card">
<h2>Win Rate</h2>
<div class="value" id="winrate">-</div>
</div>

<div class="card">
<h2>Headshot %</h2>
<div class="value" id="head">-</div>
</div>

<div class="card">
<h2>Body %</h2>
<div class="value" id="body">-</div>
</div>

<div class="card">
<h2>Leg %</h2>
<div class="value" id="leg">-</div>
</div>

<div class="card">
<h2>Favorite Agent</h2>
<div class="value" id="agent">-</div>
</div>

<div class="card">
<h2>Favorite Weapon</h2>
<div class="value" id="weapon">-</div>
</div>

<div class="card">
<h2>Matches</h2>
<div class="value" id="matches">-</div>
</div>

</div>

</div>

<footer>
Made by Siu3948
</footer>

<script>

function searchPlayer(){

let name=document.getElementById("riot").value;

if(name==""){
    alert("Enter a Riot ID!");
    return;
}

// Fake data for now.
// Next we'll replace this with REAL Valorant stats.

document.getElementById("rank").innerHTML="Immortal 3";
document.getElementById("kd").innerHTML="1.42";
document.getElementById("winrate").innerHTML="62%";
document.getElementById("head").innerHTML="31%";
document.getElementById("body").innerHTML="63%";
document.getElementById("leg").innerHTML="6%";
document.getElementById("agent").innerHTML="Jett";
document.getElementById("weapon").innerHTML="Vandal";
document.getElementById("matches").innerHTML="247";

}

</script>

</body>
</html>
