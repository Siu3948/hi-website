<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aim Trainer Deluxe</title>
<style>
  body { margin:0; overflow:hidden; background:black; color:#fff; font-family:sans-serif; }
  #menu { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.7); }
  .menu-btn { margin:0.5rem; padding:1rem 2rem; border:none; border-radius:10px; background:#ff416c; color:#fff; cursor:pointer; }
  #hud { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:30px; font-size:1.2rem; text-shadow:0 0 10px #0ff; }
  #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30px; height:30px; }
  #crosshair:before,#crosshair:after{content:'';position:absolute;background:#0ff;}
  #crosshair:before{top:50%;left:0;width:100%;height:2px;}
  #crosshair:after{left:50%;top:0;width:2px;height:100%;}
</style>
</head>
<body>
<div id="menu">
  <h1>Aim Trainer</h1>
  <input id="playerName" placeholder="Name">
  <button class="menu-btn" onclick="startGame('classic')">Classic</button>
  <button class="menu-btn" onclick="startGame('timed')">Timed</button>
  <button class="menu-btn" onclick="startGame('rapid')">Rapid</button>
  <button class="menu-btn" onclick="startGame('accuracy')">Accuracy</button>
  <button class="menu-btn" onclick="startGame('endurance')">Endurance</button>
  <button class="menu-btn" onclick="startGame('movingball')">Moving Ball</button>
  <ul id="scores"></ul>
</div>
<div id="crosshair"></div>
<div id="hud"><div id="timer">Time: 60</div><div id="scoreboard">Score: 0</div><div id="accuracy">Accuracy: 0%</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
let scene,camera,renderer,score=0,player="Guest",mode="classic",targets=[],roundTime=60,timerInterval,animationId;
let shots=0,hits=0,ballTarget,lockTime=0;

function startGame(m){
  if(renderer){renderer.domElement.remove();cancelAnimationFrame(animationId);}
  clearInterval(timerInterval);
  player=document.getElementById('playerName').value||"Guest";
  mode=m;score=0;shots=0;hits=0;lockTime=0;
  if(mode==="timed") roundTime=30;
  else if(mode==="endurance") roundTime=120;
  else roundTime=60;
  document.getElementById('menu').style.display='none';
  initScene();document.body.requestPointerLock();startTimer();
  if(mode==="movingball") spawnMovingBall(); else spawnTarget();
}

function initScene(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
  renderer=new THREE.WebGLRenderer();renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  let light=new THREE.PointLight(0xffffff,1,100);light.position.set(0,0,10);scene.add(light);
  animate();
}

let yaw=0,pitch=0;
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===document.body){
    yaw-=e.movementX*0.002;pitch-=e.movementY*0.002;
    camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;
  }
});
document.addEventListener('click',()=>{
  if(document.pointerLockElement===document.body&&mode!=="movingball"){
    shots++;
    if(mode==="accuracy" && shots>=20){ endGame(); return; }
    let r=new THREE.Raycaster();r.setFromCamera(new THREE.Vector2(0,0),camera);
    let hit=r.intersectObjects(targets);
    if(hit.length>0){scene.remove(hit[0].object);targets=[];hits++;score++;updateHUD();setTimeout(spawnTarget,mode==="rapid"?200:500);}else updateHUD();
  }
});

function spawnTarget(){
  if(targets.length>0)return;
  let c=document.createElement('canvas');c.width=256;c.height=256;let ctx=c.getContext('2d');
  for(let i=5;i>0;i--){ctx.beginPath();ctx.arc(128,128,i*25,0,Math.PI*2);ctx.fillStyle=i%2?'black':'red';ctx.fill();}
  ctx.beginPath();ctx.arc(128,128,10,0,Math.PI*2);ctx.fillStyle='yellow';ctx.fill();
  let tex=new THREE.CanvasTexture(c);
  let g=new THREE.CircleGeometry(mode==="endurance"?0.7:1,64);
  let t=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  t.position.set(Math.random()*10-5,Math.random()*5-2.5,-(Math.random()*20+5));scene.add(t);targets=[t];
}

function spawnMovingBall(){
  ballTarget=new THREE.Mesh(new THREE.SphereGeometry(0.5,32,32),new THREE.MeshBasicMaterial({color:0x0f0}));
  ballTarget.position.set(0,0,-10);scene.add(ballTarget);
}

function animate(){
  animationId=requestAnimationFrame(animate);
  if(mode==="movingball"&&ballTarget){
    ballTarget.position.x=Math.sin(Date.now()*0.001)*5;
    ballTarget.position.y=Math.cos(Date.now()*0.0015)*3;
    let r=new THREE.Raycaster();r.setFromCamera(new THREE.Vector2(0,0),camera);
    if(r.intersectObject(ballTarget).length>0){lockTime+=0.016;score=Math.floor(lockTime);updateHUD();}
  }
  renderer.setClearColor(0x000000); // ensure black background
  renderer.render(scene,camera);
}

function startTimer(){
  let time=roundTime;document.getElementById('timer').innerText="Time: "+time;
  timerInterval=setInterval(()=>{time--;document.getElementById('timer').innerText="Time: "+time;if(time<=0){clearInterval(timerInterval);endGame();}},1000);
}

function endGame(){alert(`Game Over! Score: ${score}`);saveScore();document.getElementById('menu').style.display='flex';}

function updateHUD(){
  document.getElementById('scoreboard').innerText="Score: "+score;
  let acc=(shots>0)?Math.round((hits/shots)*100):0;
  document.getElementById('accuracy').innerText="Accuracy: "+(mode==="movingball"?"N/A":acc+"%");
}

function saveScore(){
  let scores=JSON.parse(localStorage.getItem('scores')||'[]');
  scores.push({player,score,mode,accuracy:(shots>0?Math.round((hits/shots)*100):0)});
  localStorage.setItem('scores',JSON.stringify(scores));renderScores();
}

function renderScores(){
  let scores=JSON.parse(localStorage.getItem('scores')||'[]');
  let list=document.getElementById('scores');list.innerHTML='';
  scores.slice(-10).reverse().forEach(s=>{
    let li=document.createElement('li');
    li.innerText=`${s.player} - ${s.mode} - Score: ${s.score} - Acc: ${s.accuracy}%`;
    list.appendChild(li);
  });
}
</script>
</body>
</html>
